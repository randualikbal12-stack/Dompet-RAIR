<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B2545"><link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><title>Dompet Digital</title>
<style>
:root{--bg:#F4F6F9;--card:#FFFFFF;--soft:#EEF2F7;--line:#DDE3EA;--tx:#18212C;--tx2:#5A6676;--tx3:#8D97A4;--acc:#1E5FB3;--acc2:#DDE9FA;--ok:#0F7A55;--okb:#DDF3E8;--no:#B3261E;--nob:#FBE2E0;--wa:#8A5A00;--wab:#FAEEDA}
@media(prefers-color-scheme:dark){:root{--bg:#10141A;--card:#1B2029;--soft:#232A35;--line:#333C49;--tx:#E7ECF2;--tx2:#A7B1BE;--tx3:#7A8492;--acc:#6FA6F5;--acc2:#1D3354;--ok:#5DD39E;--okb:#153A2B;--no:#FF8A80;--nob:#44201E;--wa:#F2C46D;--wab:#3D2F14}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{max-width:640px;margin:0 auto;padding:0 12px calc(24px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(8px + env(safe-area-inset-top)) 0 6px}
.top{display:flex;justify-content:space-between;align-items:center}.top b{font-size:17px}
.pill{font-size:11px;padding:3px 9px;border-radius:10px;background:var(--okb);color:var(--ok);font-weight:500}.pill.w{background:var(--wab);color:var(--wa)}.pill.n{background:var(--nob);color:var(--no)}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:18px;padding:7px 13px;font:inherit;font-size:13px}
nav button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin:10px 0}
.card h3{margin:0 0 9px;font-size:13px;font-weight:600;color:var(--tx2)}
.big{font-size:26px;font-weight:600;letter-spacing:-.3px}.mut{color:var(--tx2);font-size:12px}.tiny{color:var(--tx3);font-size:11px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kp{background:var(--soft);border-radius:10px;padding:9px;cursor:pointer}.kp .a{font-size:11px;color:var(--tx2)}.kp .b{font-size:15px;font-weight:600;margin-top:2px}
.up{color:var(--ok)}.dn{color:var(--no)}.ac{color:var(--acc)}
.row{display:flex;align-items:center;gap:8px;padding:9px 2px;border-top:1px solid var(--line);cursor:pointer}.row:first-child{border-top:0}
.row .l{flex:1;min-width:0}.row .t1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .t2{font-size:11px;color:var(--tx3)}
.row .r{text-align:right;white-space:nowrap;font-weight:600}
.chev{color:var(--tx3);font-size:16px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%;min-height:38px}
button.b{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:9px;padding:8px 12px;min-height:38px;cursor:pointer}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}button.d{color:var(--no)}
.fl{display:grid;grid-template-columns:1fr 1fr;gap:7px}.fl .w2{grid-column:span 2}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.chip{background:var(--acc2);color:var(--acc);border-radius:14px;padding:4px 10px;font-size:12px;cursor:pointer}
.seg{display:flex;gap:5px}.seg button{flex:1;font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 4px}.seg button.on{background:var(--acc2);color:var(--acc);border-color:transparent;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:12.5px}th{text-align:left;font-weight:600;color:var(--tx2);font-size:11px;padding:4px 3px}td{padding:6px 3px;border-top:1px solid var(--line)}td.n,th.n{text-align:right;white-space:nowrap}
tr.cl{cursor:pointer}.hero .big{font-size:26px;font-weight:700;margin:2px 0;display:inline-block}
.alloc{display:flex;justify-content:space-around;margin-top:10px;text-align:center}.ab{width:54px;height:54px;border-radius:50%;border:3px solid;display:flex;align-items:center;justify-content:center;font-weight:700;margin:0 auto 3px}
.pc{display:flex;gap:10px;padding:11px;border:1px solid var(--line);border-radius:12px;margin:8px 0;cursor:pointer;background:var(--card)}.pc:active{opacity:.7}.pi{width:38px;height:38px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto}
.pr{display:flex;justify-content:space-between;margin-top:6px;gap:8px}
.sb{padding:6px 10px}.sbh,.sbr{display:grid;grid-template-columns:1fr 1.2fr 1.2fr 1.1fr;gap:6px;align-items:start}.sbh{font-size:11px;color:var(--tx2);padding:6px 0;border-bottom:1px solid var(--line)}.sbh div:not(:first-child),.sbr div:not(:first-child){text-align:right}
.sbr{padding:10px 0;border-bottom:1px solid var(--line);font-size:12.5px;cursor:pointer}.sbr:last-child{border-bottom:0}.sbr:active{opacity:.7}
table.sm{font-size:11.5px}table.sm td,table.sm th{padding:5px 2px}
.bk{margin-bottom:8px;min-height:32px;padding:4px 12px}
.sheet h4,.card h4{margin:14px 0 4px;font-size:12px;font-weight:600;color:var(--tx2);text-transform:none}
.box{background:var(--soft);border-radius:10px;padding:4px 10px;margin:6px 0}.box .kv{border-top-color:var(--line)}
.lb{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--tx2)}.lb.ck{flex-direction:row;align-items:center;gap:8px;font-size:12.5px;color:var(--tx)}.lb.ck input{width:auto;min-height:0}
.ol{margin:0;padding-left:20px;font-size:13px}.ol li{margin:4px 0}
.gi{padding:9px 0;border-top:1px solid var(--line)}.gi:first-of-type{border-top:0}
button.sm{min-height:30px;padding:4px 10px;font-size:12px;white-space:nowrap}
.kp[data-x],.kp[data-rg]{position:relative}.kp[data-x]:active,.row:active,tr.cl:active{opacity:.7}
.row .r div{white-space:nowrap}
.tw{overflow-x:auto;margin:0 -4px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--acc)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--card);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom))}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:13px}.kv span:first-child{color:var(--tx2)}.kv:first-child{border-top:0}
.tree .n0{font-weight:600}.tree .n1{padding-left:14px}.tree .n2{padding-left:28px;font-size:12.5px;color:var(--tx2)}
.ch{position:relative;height:200px}
.empty{text-align:center;color:var(--tx3);padding:20px 0}
.st{font-weight:600;padding:9px;border-radius:10px;margin-top:8px;font-size:13px}.st.ok{background:var(--okb);color:var(--ok)}.st.w{background:var(--wab);color:var(--wa)}
</style>
<script>
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));
</script>
</head><body>
<header><div class="top"><b>Dompet Digital</b><span id="net" class="pill">…</span></div>
<nav id="nav"></nav></header>
<main id="main"></main>
<div class="sheet" id="sheet"><div class="in" id="sheetIn"></div></div>
<script src="libs.js"></script><script src="seed.js"></script><script src="inv.js"></script><script src="app.js"></script>
</body></html>
