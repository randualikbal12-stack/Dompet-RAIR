<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><script>try{var t=localStorage.getItem('dd-theme');if(t&&t!=='auto')document.documentElement.dataset.theme=t}catch(e){}</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0D10"><link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><title>Dompet Digital</title>
<style>
:root{--bg:#F5F6F8;--card:#FFFFFF;--soft:#F0F2F5;--line:#E6E8EC;--tx:#111418;--tx2:#5B6370;--tx3:#8E96A1;--acc:#00A86B;--acc2:#DDF4EA;--ok:#00A86B;--okb:#DDF4EA;--no:#E5383B;--nob:#FDE7E7;--wa:#B07A00;--wab:#FFF3D6}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0B0D10;--card:#15181D;--soft:#1D2127;--line:#262B33;--tx:#EDEFF2;--tx2:#A4ACB7;--tx3:#6F7782;--acc:#00C27A;--acc2:#0F2E22;--ok:#00C27A;--okb:#0F2E22;--no:#FF5A5F;--nob:#3A1719;--wa:#F5B83D;--wab:#3A2C10}}
:root[data-theme=dark]{--bg:#0B0D10;--card:#15181D;--soft:#1D2127;--line:#262B33;--tx:#EDEFF2;--tx2:#A4ACB7;--tx3:#6F7782;--acc:#00C27A;--acc2:#0F2E22;--ok:#00C27A;--okb:#0F2E22;--no:#FF5A5F;--nob:#3A1719;--wa:#F5B83D;--wab:#3A2C10}
:root{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{max-width:640px;margin:0 auto;padding:0 12px calc(24px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(8px + env(safe-area-inset-top)) 0 6px}
.top{display:flex;justify-content:space-between;align-items:center}.top b{font-size:17px}
.pill{font-size:11px;padding:3px 9px;border-radius:10px;background:var(--okb);color:var(--ok);font-weight:500}.pill.w{background:var(--wab);color:var(--wa)}.pill.n{background:var(--nob);color:var(--no)}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:18px;padding:7px 13px;font:inherit;font-size:13px}
nav button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin:10px 0}
.card h3{margin:0 0 9px;font-size:13px;font-weight:600;color:var(--tx2)}
.big{font-size:26px;font-weight:600;letter-spacing:-.3px}.mut{color:var(--tx2);font-size:12px}.tiny{color:var(--tx3);font-size:11px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kp{background:var(--soft);border-radius:10px;padding:9px;cursor:pointer}.kp .a{font-size:11px;color:var(--tx2)}.kp .b{font-size:15px;font-weight:600;margin-top:2px}
.up{color:var(--ok)}.dn{color:var(--no)}.ac{color:var(--acc)}
.row{display:flex;align-items:center;gap:8px;padding:9px 2px;border-top:1px solid var(--line);cursor:pointer}.row:first-child{border-top:0}
.row .l{flex:1;min-width:0}.row .t1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .t2{font-size:11px;color:var(--tx3)}
.row .r{text-align:right;white-space:nowrap;font-weight:600}
.chev{color:var(--tx3);font-size:16px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%;min-height:38px}
button.b{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:9px;padding:8px 12px;min-height:38px;cursor:pointer}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}button.d{color:var(--no)}
.fl{display:grid;grid-template-columns:1fr 1fr;gap:7px}.fl .w2{grid-column:span 2}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.chip{background:var(--acc2);color:var(--acc);border-radius:14px;padding:4px 10px;font-size:12px;cursor:pointer}
.seg{display:flex;gap:5px}.seg button{flex:1;font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 4px}.seg button.on{background:var(--acc2);color:var(--acc);border-color:transparent;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:12.5px}th{text-align:left;font-weight:600;color:var(--tx2);font-size:11px;padding:4px 3px}td{padding:6px 3px;border-top:1px solid var(--line)}td.n,th.n{text-align:right;white-space:nowrap}
tr.cl{cursor:pointer}.lockw{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;align-items:center;justify-content:center}
.lk{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;max-width:320px;padding:20px}
.dots{display:flex;gap:12px;margin:8px 0}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--acc)}.dots i.on{background:var(--acc)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px;margin:6px 0}.pad button{height:64px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:22px;font-weight:600}.pad button:active{background:var(--acc2)}
.hero .big{font-size:26px;font-weight:700;margin:2px 0;display:inline-block}
.alloc{display:flex;justify-content:space-around;margin-top:10px;text-align:center}.ab{width:54px;height:54px;border-radius:50%;border:3px solid;display:flex;align-items:center;justify-content:center;font-weight:700;margin:0 auto 3px}
.pc{display:flex;gap:10px;padding:11px;border:1px solid var(--line);border-radius:12px;margin:8px 0;cursor:pointer;background:var(--card)}.pc:active{opacity:.7}.pi{width:38px;height:38px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto}
.pr{display:flex;justify-content:space-between;margin-top:6px;gap:8px}
.sb{padding:6px 10px}.sbh,.sbr{display:grid;grid-template-columns:1fr 1.2fr 1.2fr 1.1fr;gap:6px;align-items:start}.sbh{font-size:11px;color:var(--tx2);padding:6px 0;border-bottom:1px solid var(--line)}.sbh div:not(:first-child),.sbr div:not(:first-child){text-align:right}
.sbr{padding:10px 0;border-bottom:1px solid var(--line);font-size:12.5px;cursor:pointer}.sbr:last-child{border-bottom:0}.sbr:active{opacity:.7}
table.sm{font-size:11.5px}table.sm td,table.sm th{padding:5px 2px}
.bk{margin-bottom:8px;min-height:32px;padding:4px 12px}
.sheet h4,.card h4{margin:14px 0 4px;font-size:12px;font-weight:600;color:var(--tx2);text-transform:none}
.box{background:var(--soft);border-radius:10px;padding:4px 10px;margin:6px 0}.box .kv{border-top-color:var(--line)}
.lb{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--tx2)}.lb.ck{flex-direction:row;align-items:center;gap:8px;font-size:12.5px;color:var(--tx)}.lb.ck input{width:auto;min-height:0}
.ol{margin:0;padding-left:20px;font-size:13px}.ol li{margin:4px 0}
.gi{padding:9px 0;border-top:1px solid var(--line)}.gi:first-of-type{border-top:0}
button.sm{min-height:30px;padding:4px 10px;font-size:12px;white-space:nowrap}
.kp[data-x],.kp[data-rg]{position:relative}.kp[data-x]:active,.row:active,tr.cl:active{opacity:.7}
.row .r div{white-space:nowrap}
.tw{overflow-x:auto;margin:0 -4px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--acc)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--card);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom))}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:13px}.kv span:first-child{color:var(--tx2)}.kv:first-child{border-top:0}
.tree .n0{font-weight:600}.tree .n1{padding-left:14px}.tree .n2{padding-left:28px;font-size:12.5px;color:var(--tx2)}
.ch{position:relative;height:200px}
.empty{text-align:center;color:var(--tx3);padding:20px 0}
.st{font-weight:600;padding:9px;border-radius:10px;margin-top:8px;font-size:13px}.st.ok{background:var(--okb);color:var(--ok)}.st.w{background:var(--wab);color:var(--wa)}

/* menu samping */
.top{gap:10px}.top b{flex:1}.mb{border:0;background:var(--card);color:var(--tx);width:40px;height:40px;border-radius:12px;font-size:20px;border:1px solid var(--line)}
nav{position:fixed;top:0;left:0;bottom:0;width:260px;max-width:80vw;z-index:30;background:var(--card);display:flex;flex-direction:column;gap:2px;overflow-y:auto;padding:calc(14px + env(safe-area-inset-top)) 10px 20px;transform:translateX(-105%);transition:transform .22s ease;box-shadow:2px 0 18px rgba(0,0,0,.18)}
body.dopen nav{transform:none}#scrim{position:fixed;inset:0;z-index:29;background:rgba(0,0,0,.35);display:none}body.dopen #scrim{display:block}
nav .dh{padding:4px 10px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}nav .dh b{font-size:17px}
nav button{display:flex;align-items:center;gap:12px;flex:none;width:100%;text-align:left;border:0;border-radius:10px;background:transparent;padding:11px 12px;font-size:14.5px}
nav button .ic{width:22px;text-align:center;font-size:17px}nav button.on{background:var(--acc2);color:var(--acc);font-weight:600}
.bdg{margin-left:auto;background:var(--no);color:#fff;border-radius:10px;font-size:11px;padding:1px 7px}
#fab{position:fixed;right:max(16px,calc(50vw - 304px));bottom:calc(18px + env(safe-area-inset-bottom));z-index:20;width:56px;height:56px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:28px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
@media(min-width:1100px){nav{transform:none;box-shadow:none;border-right:1px solid var(--line)}body{padding-left:272px;max-width:912px}#fab{right:24px}#scrim{display:none!important}.mb{display:none}}
/* PIN */
.pw{position:relative;display:block}.pw input{padding-right:44px}.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:transparent;font-size:18px;width:38px;height:36px;color:var(--tx)}
.rec{font:600 22px/1.2 ui-monospace,monospace;letter-spacing:2px;text-align:center;background:var(--soft);border:1px dashed var(--line);border-radius:10px;padding:14px;margin:10px 0;user-select:all}
/* anggaran, rutin */
.mnav{display:flex;align-items:center;justify-content:space-between;margin:8px 0}.mnav .b{min-width:44px}
.bud{padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}.bud:last-child{border-bottom:0}.bh{display:flex;justify-content:space-between;gap:8px;align-items:center}
.bb{height:8px;background:var(--soft);border-radius:5px;overflow:hidden;margin:5px 0 3px}.bb i{display:block;height:100%;border-radius:5px;background:var(--ok)}.bb i.wa{background:#D9A21B}.bb i.no{background:var(--no)}
.pill.no{background:var(--nob);color:var(--no)}.pill.wa{background:var(--wab);color:var(--wa)}.pill.nt{background:var(--soft);color:var(--tx2)}
.rut{padding:10px 0;border-bottom:1px solid var(--line)}.rut:last-child{border-bottom:0}.rl{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:13px}
img.struk{max-width:100%;max-height:260px;border-radius:8px;border:1px solid var(--line);display:block;margin-top:6px}
#print{display:none}
@media print{body{max-width:none;padding:0;background:#fff;color:#000}header,main,nav,#fab,#scrim,.sheet,.lockw{display:none!important}#print{display:block;font:11px/1.4 system-ui,sans-serif;color:#000}
 #print h1{font-size:18px;margin:0 0 2px}#print h2{break-after:avoid;font-size:13px;margin:14px 0 4px;border-bottom:1px solid #999}#print .pm{color:#555}#print table{width:100%;border-collapse:collapse}
 #print td,#print th{padding:2px 4px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top}#print .n{text-align:right;white-space:nowrap}#print tr.t td{font-weight:700}#print tr.s td{font-weight:600}#print td.k{padding-left:16px}#print table.tl{font-size:9.5px}#print tr{break-inside:avoid}}

/* gaya sekuritas */
body{font-variant-numeric:tabular-nums}.card{border-radius:16px}.card h3{text-transform:none;letter-spacing:.1px}
.hero2{background:linear-gradient(135deg,var(--card),var(--soft));border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0}
.hero2 .hh{display:flex;justify-content:space-between;align-items:center;color:var(--tx2);font-size:12.5px}
.eyeb{border:0;background:transparent;font-size:18px;color:var(--tx2);padding:2px 6px}
.hero2 .hv{font-size:30px;font-weight:700;letter-spacing:-.5px;margin:2px 0 4px;cursor:pointer}
.hero2 .hs{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;font-weight:600}.hero2 .hs span{cursor:pointer}.hero2 small{font-weight:400;color:var(--tx3)}
.hero2 .hg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.hero2 .hg div{cursor:pointer;min-width:0}.hero2 .hg small{display:block;color:var(--tx3);font-size:11px}.hero2 .hg b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.qa{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:4px 0 6px}.qa button{border:0;background:transparent;color:var(--tx2);font:inherit;font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0}
.qa button span{width:42px;height:42px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:19px}
.hh3{display:flex;align-items:center;gap:6px;cursor:pointer;margin:0!important}.hh3 .cv{margin-left:auto;transition:transform .2s;color:var(--tx3);font-size:16px}.hc .hb{margin-top:9px}.hc.col .hb{display:none}.hc.col .cv{transform:rotate(-90deg)}
.ch.sm{height:190px;position:relative}.hsr{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--line)}.hsr .b{min-height:32px;padding:2px 10px}
.sbar{position:sticky;top:calc(58px + env(safe-area-inset-top));z-index:4;background:var(--bg);padding:6px 0}.sbar input{border-radius:22px;padding:10px 16px;min-height:44px}
details.card summary{cursor:pointer;color:var(--tx2);font-size:13px}
.top .mb#hideTop{width:36px;height:36px;font-size:16px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.kp .b{font-size:clamp(12px,3.7vw,15px);overflow-wrap:anywhere}
.hero2 .hg b{font-size:clamp(11.5px,3.4vw,13.5px);overflow:visible;text-overflow:clip}
</style>
<script>
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));
</script>
</head><body>
<header><div class="top"><button id="menuB" class="mb" aria-label="Buka menu">☰</button><b id="ttl">Beranda</b><button id="hideTop" class="mb" aria-label="Sembunyikan saldo">👁</button><span id="net" class="pill">…</span></div></header>
<div id="scrim"></div><nav id="nav"></nav>
<button id="fab" aria-label="Catat transaksi">＋</button><div id="print"></div>
<main id="main"></main>
<div class="lockw" id="lock"></div>
<div class="sheet" id="sheet"><div class="in" id="sheetIn"></div></div>
<script src="libs.js"></script><script src="seed.js"></script><script src="inv.js"></script><script src="app.js"></script>
</body></html>
